settings:
  architecture:
    type: str
    default: gpgpu32
    manifest_dir: architectures
    rtl:
      sp_per_sm:
        type: int
        default: 32
      thread:
        count:
          type: int
          default: 32
        id_register:
          type: str
          default: x31
    memory:
      imem_words:
        type: int
        default: 2048
      dmem_words:
        type: int
        default: 2048
      word_bytes:
        type: int
        default: 4
      imem:
        origin:
          type: int
          default: 0
        words:
          type: int
          default: 2048
      dmem:
        origin:
          type: int
          default: 0
        words:
          type: int
          default: 2048
    abi:
      args:
        base_word:
          type: int
          default: 16
        words:
          type: int
          default: 4
      data:
        base_word:
          type: int
          default: 1024
      stack:
        per_lane_bytes:
          type: int
          default: 64
        top_word:
          type: int
          default: 2048
  board_type:
    type: str
    default: zynq7000-zedboard
    manifest_dir: boards
  board:
    type: str
    default: zedboard
    configure_policy:
      type: enum
      choices:
      - if-needed
      - always
      - never
      default: if-needed
    port:
      type: str
      default: /dev/ttyACM0
  program:
    type: str
    default: nbody
    manifest_dir: programs
    optimization:
      type: enum
      choices:
      - O0
      - O1
      - O2
      - O3
      default: O2
    march:
      type: str
      default: rv32im
    mabi:
      type: str
      default: ilp32
  demo:
    type: str
    default: nbody
    manifest_dir: demos
    fps:
      type: int
      default: 12
    dataset:
      type: str
      default: default
    steps_per_frame:
      type: int
      default: 1
    http_host:
      type: str
      default: 0.0.0.0
    http_port:
      type: int
      default: 8765
  backend:
    type: enum
    choices:
    - fake
    - fpga-uart
    default: fake
  toolchain:
    type: str
    default: riscv-gcc-rv32im-ilp32
  rtl:
    sp_per_sm:
      type: int
      default: 32
    imem_words:
      type: int
      default: 2048
    dmem_words:
      type: int
      default: 2048
  fpga:
    synth:
      strategy:
        type: str
        default: default
    part:
      type: str
      default: xc7z020clg484-1
  kernel:
    load_policy:
      type: enum
      choices:
      - if-needed
      - always
      - never
      default: if-needed
    kernel_calls:
      type: int
      default: 1
  uart:
    baud:
      type: int
      default: 115200
  executor:
    verbosity:
      type: int
      default: 0
