goals:
  sw:
    abi:
      kind: artifact
      public: false
      description: Generate software ABI files for the selected GPGPU architecture.
      params:
      - architecture
      - architecture.rtl.thread.count
      - architecture.rtl.thread.id_register
      - architecture.memory.word_bytes
      - architecture.memory.imem.origin
      - architecture.memory.imem.words
      - architecture.memory.dmem.origin
      - architecture.memory.dmem.words
      - architecture.abi.args.base_word
      - architecture.abi.args.words
      - architecture.abi.data.base_word
      - architecture.abi.stack.per_lane_bytes
      - architecture.abi.stack.top_word
      artifact:
        input_globs:
        - sw/programs/gpgpu_runtime.h.in
        - sw/programs/gpgpu.ld.in
        outputs:
          runtime_header:
            description: generated GPGPU runtime header
            path: gpgpu_runtime.h
          linker_script:
            description: generated GPGPU linker script
            path: gpgpu.ld
          metadata:
            description: generated GPGPU ABI metadata
            path: gpgpu_abi.json
    program:
      native:
        kind: artifact
        public: true
        description: Build a native reference executable for a selected program.
        params:
        - program
        - program.optimization
        artifact:
          input_globs:
          - sw/programs/Makefile
          - sw/programs/{program}/*.c
          - sw/programs/{program}/*.h
          outputs:
            executable:
              description: native reference executable artifact
              path: '{program}_x86'
        dependencies:
        - goal: sw.abi
      elf:
        kind: artifact
        public: true
        description: Build a RISC-V ELF for the selected GPGPU program.
        params:
        - program
        - architecture
        - program.optimization
        - program.march
        - program.mabi
        artifact:
          input_globs:
          - sw/programs/Makefile
          - sw/programs/{program}/*.c
          - sw/programs/{program}/*.h
          - sw/programs/{program}/*.S
          - sw/programs/{program}/*.s
          - sw/programs/{program}/*.ld
          - sw/programs/{program}/fpga.py
          outputs:
            elf:
              description: RISC-V ELF artifact
              path: '{program}.elf'
            map:
              description: linker map artifact
              path: '{program}.map'
        dependencies:
        - goal: sw.abi
      image:
        kind: artifact
        public: true
        description: Build an instruction-memory image for the selected program.
        params:
        - program
        - architecture
        - program.optimization
        - program.march
        - program.mabi
        artifact:
          input_globs:
          - sw/programs/Makefile
          - sw/programs/{program}/*.c
          - sw/programs/{program}/*.h
          - sw/programs/{program}/*.S
          - sw/programs/{program}/*.s
          - sw/programs/{program}/*.ld
          - sw/programs/{program}/fpga.py
          outputs:
            imem:
              description: instruction-memory image artifact
              path: '{program}_instructions.mem'
            objdump:
              description: objdump artifact
              path: '{program}_dump_real.asm'
        dependencies:
        - goal: sw.program.elf
  hw:
    board:
      project:
        kind: artifact
        public: false
        description: Internal mock Vivado project artifact.
        params:
        - architecture
        - board_type
        - rtl.sp_per_sm
        - rtl.imem_words
        - rtl.dmem_words
        - fpga.part
      bitstream:
        kind: artifact
        public: true
        description: Build a programmable-logic bitstream.
        params:
        - architecture
        - board_type
        - rtl.sp_per_sm
        - rtl.imem_words
        - rtl.dmem_words
        - fpga.part
        - fpga.synth.strategy
        dependencies:
        - goal: hw.board.project
      program:
        kind: action
        public: true
        description: Configure the selected board with a compatible bitstream.
        params:
        - board
        - board.configure_policy
        - board.port
        side_effects:
        - configure selected board FPGA fabric
        dependencies:
        - goal: hw.board.bitstream
      kernel:
        load:
          kind: action
          public: true
          description: Load a GPGPU program image and initial data into hardware.
          params:
          - board
          - kernel.load_policy
          - uart.baud
          side_effects:
          - load selected program image into board memory
          dependencies:
          - goal: hw.board.program
          - goal: sw.program.image
        run:
          kind: action
          public: true
          description: Run a loaded GPGPU kernel through the current transport.
          params:
          - board
          - kernel.kernel_calls
          side_effects:
          - run loaded kernel on selected board
          dependencies:
          - goal: hw.board.kernel.load
    rtl:
      assemble:
        kind: artifact
        public: false
        description: Internal assembly fixture generation.
        params:
        - architecture
        - rtl.imem_words
        - rtl.dmem_words
      sim_executable:
        kind: artifact
        public: false
        description: Internal Icarus simulation executable.
        params:
        - architecture
        - rtl.sp_per_sm
        - rtl.imem_words
        - rtl.dmem_words
  demo:
    run:
      kind: service
      public: true
      description: Run the selected interactive demo service.
      params:
      - demo
      - backend
      - demo.fps
      - demo.dataset
      - demo.steps_per_frame
      - demo.http_host
      - demo.http_port
      lifecycle: long-running
      side_effects:
      - start selected interactive demo service
      dependencies:
      - goal: sw.program.native
        when:
          backend: fake
      - goal: hw.board.kernel.load
        note_kind: included
        note_subject: hw.board.kernel.load
        note_reason: backend=fpga-uart requires hardware program-image load
        when:
          backend: fpga-uart
      omitted_dependency_notes:
      - kind: omitted
        subject: hw.board.bitstream, hw.board.program, hw.board.kernel.load
        reason: backend=fake uses native reference path
        when:
          backend: fake
  test:
    rtl:
      kind: check
      public: true
      description: Run the RTL simulation test suite.
      params:
      - architecture
      - rtl.sp_per_sm
      - rtl.imem_words
      - rtl.dmem_words
      dependencies:
      - goal: hw.rtl.assemble
      - goal: hw.rtl.sim_executable
    program:
      kind: check
      public: true
      description: Compare a native program run against generated program artifacts.
      params:
      - program
      - architecture
      - program.optimization
      dependencies:
      - goal: sw.program.native
      - goal: sw.program.image
