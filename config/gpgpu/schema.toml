[settings.architecture]
type = "str"
default = "gpgpu32"
manifest_dir = "architectures"

[settings.board_type]
type = "str"
default = "zynq7000-zedboard"
manifest_dir = "board_types"

[settings.board]
type = "str"
default = "zedboard"

[settings.program]
type = "str"
default = "nbody"
manifest_dir = "programs"

[settings.demo]
type = "str"
default = "nbody"
manifest_dir = "demos"

[settings.backend]
type = "enum"
choices = ["fake", "fpga-uart"]
default = "fake"

[settings.toolchain]
type = "str"
default = "riscv-gcc-rv32im-ilp32"

[settings."program.optimization"]
type = "enum"
choices = ["O0", "O1", "O2", "O3"]
default = "O2"

[settings."program.march"]
type = "str"
default = "rv32im"

[settings."program.mabi"]
type = "str"
default = "ilp32"

[settings."rtl.sp_per_sm"]
type = "int"
default = 32

[settings."rtl.imem_words"]
type = "int"
default = 2048

[settings."rtl.dmem_words"]
type = "int"
default = 2048

[settings."fpga.synth.strategy"]
type = "str"
default = "default"

[settings."fpga.part"]
type = "str"
default = "xc7z020clg484-1"

[settings."board.configure_policy"]
type = "enum"
choices = ["if-needed", "always", "never"]
default = "if-needed"

[settings."kernel.load_policy"]
type = "enum"
choices = ["if-needed", "always", "never"]
default = "if-needed"

[settings."kernel.kernel_calls"]
type = "int"
default = 1

[settings."demo.fps"]
type = "int"
default = 12

[settings."demo.dataset"]
type = "str"
default = "default"

[settings."demo.steps_per_frame"]
type = "int"
default = 1

[settings."demo.http_host"]
type = "str"
default = "0.0.0.0"

[settings."demo.http_port"]
type = "int"
default = 8765

[settings."board.port"]
type = "str"
default = "/dev/ttyACM0"

[settings."uart.baud"]
type = "int"
default = 115200

[settings."executor.verbosity"]
type = "int"
default = 0
