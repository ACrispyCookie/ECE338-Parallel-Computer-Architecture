# A profile selects a complete scenario and may override manifest defaults.
[profiles.zed-demo]
backend = "fpga-uart"

[profiles.zed-demo.architecture]
name = "gpgpu32"

[profiles.zed-demo.platform]
name = "zynq7000-zedboard"

[profiles.zed-demo.board]
name = "lab-zed"
configure_policy = "if-needed"

[profiles.zed-demo.program]
name = "nbody-3d"
optimization = "O2"

[profiles.zed-demo.demo]
name = "nbody-3d"
fps = 12
dataset = "rings"

[profiles.zed-demo.fpga.synth]
strategy = "Performance_Explore"
