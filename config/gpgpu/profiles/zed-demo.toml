# Complete scenario for the ZedBoard-backed nbody-3d demo.
[profile]
backend = "fpga-uart"

[profile.architecture]
name = "gpgpu32"

[profile.board_type]
name = "zynq7000-zedboard"

[profile.board]
configure_policy = "if-needed"

[profile.program]
name = "nbody-3d"
optimization = "O2"

[profile.demo]
name = "nbody-3d"
fps = 12
dataset = "rings"

[profile.fpga.synth]
strategy = "Performance_Explore"
